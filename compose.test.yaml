services:
  tests:
    build: .
    image: ${COMPOSE_PROJECT_NAME:?}-app:local
    environment:
      DJANGO_SETTINGS_MODULE: researchloop.config.portable_settings
      TWIGGLE_SECRET_KEY: ${TWIGGLE_SECRET_KEY:?}
      TWIGGLE_ORIGIN: ${TWIGGLE_ORIGIN:?}
      TWIGGLE_DATABASE_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?}
      U4_PRIVATE_ARTIFACTS: /artifacts
    command: [python, manage.py, test, tests/portable, '--pattern=test_*.py', '-v', '2']
    read_only: true
    tmpfs: ['/tmp:size=64m,mode=1777']
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
